<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d1117">
  <title>{% block title %}LANStream{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <a class="brand" href="{{ url_for('home') }}"><span class="brand-mark" aria-hidden="true">L</span>LANStream</a>
    {% block topbar_filter %}{% endblock %}
  </div>
  <nav class="topbar-actions" aria-label="Server navigation">
  <a class="nav-link {% if request.endpoint in ['home','browse','video_detail'] %}active{% endif %}" href="{{ url_for('home') }}">Library</a>
  <a class="nav-link {% if request.endpoint == 'transcoder_status_page' %}active{% endif %}" href="{{ url_for('transcoder_status_page') }}">Activity</a>
  {% if can_manage_settings %}<a class="nav-link {% if request.endpoint == 'settings_page' %}active{% endif %}" href="{{ url_for('settings_page') }}">Settings</a>{% endif %}
  {% if session.get('authenticated') %}<a class="logout" href="{{ url_for('logout') }}">Log out</a>{% endif %}
  </nav>
</header>
<main class="page">{% block content %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body>
</html>
